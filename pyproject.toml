[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravinns"
version = "1.0.1"
description = "Physics-informed neural networks for post-Newtonian compact-binary dynamics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Javier Matulich"}]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "torch>=2.0",
    "matplotlib>=3.6",
    "pandas>=1.5",
    "tqdm>=4.64",
]

[project.optional-dependencies]
notebook = ["jupyterlab", "ipywidgets", "ipython>=8.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JavierMatulich/GravINNs"
Repository = "https://github.com/JavierMatulich/GravINNs"
Issues = "https://github.com/JavierMatulich/GravINNs/issues"

[project.scripts]
gravinns-nc30 = "gravinns.experiments.near_circular_n30:main"
gravinns-longorbit = "gravinns.experiments.long_orbit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: reduced-budget integration tests that execute real training loops",
]
